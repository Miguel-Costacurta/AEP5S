# =====================================================================
# BANCO DE DADOS ? H2 (arquivo local, persiste entre execuções)
# =====================================================================
spring.datasource.url=jdbc:h2:./data/centraldb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 acessível em http://localhost:8080/h2-console (útil para debug)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =====================================================================
# JPA / HIBERNATE
# =====================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# update: cria/atualiza tabelas automaticamente sem apagar dados existentes
# Em produção, trocar por validate ou gerenciar com Flyway/Liquibase
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.main.allow-circular-references=true

# =====================================================================
# JWT
# =====================================================================
# Troque o secret por uma string longa e aleatória antes de entregar o projeto
jwt.secret=central-atendimento-chave-secreta-2024-minimo32chars
jwt.expiration=86400000

# =====================================================================
# SERVIDOR
# =====================================================================
server.port=8080