<!DOCTYPE html>

<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nova Solicitação</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="navbar">
    <span class="logo">Central de Solicitações</span>
    <a href="index.html">Início</a>
    <a href="solicitar.html">Nova solicitação</a>
    <a href="acompanhar.html">Acompanhar</a>
    <a href="atendente.html">Atendente</a>
    <a href="gestor.html">Gestor</a>
</div>

<h1>Nova Solicitação</h1>

<form id="formSolicitacao">

    <label for="perfil">Você é</label>
    <select id="perfil">
        <option value="LOGADO">Cadastrado</option>
        <option value="ANONIMO">Anônimo</option>
    </select>

    <div id="camposCadastrado" style="display: block">
        <label for="nome">Nome</label>
        <input type="text" id="nome">

        <label for="email">Email</label>
        <input type="email" id="email">
    </div>

    <label for="tipo">Tipo</label>
    <select id="tipo">
        <option value="DENUNCIA_BURACO">Denúncia de buraco</option>
        <option value="SOLICITACAO_PODA">Solicitação de poda</option>
        <option value="SOLICITACAO_ARVORE_CAIDA">Remoção de árvore caída</option>
        <option value="SOLICITACAO_REFORMA">Solicitação de reforma</option>
        <option value="DENUNCIA_MAUS_TRATOS" id="opcaoMausTratos">Denúncia de maus-tratos</option>
        <option value="SOLICITACAO_ILUMINACAO">Solicitação de iluminação queimada</option>
    </select>

    <label for="prioridade">Prioridade</label>
    <select id="prioridade">
        <option value="ALTA">Alta</option>
        <option value="MEDIA">Média</option>
        <option value="BAIXA">Baixa</option>
    </select>

    <label for="descricao">Descrição</label>
    <textarea id="descricao"></textarea>

    <label for="local">Localização</label>
    <input type="text" id="local">

    <button type="submit">Enviar</button>

</form>

<div id="resultado"></div>

<script src="js/solicitar.js"></script>
</body>
</html>
